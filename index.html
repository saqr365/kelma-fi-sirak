<script>
const htmlEl=document.documentElement;
const themeToggle=document.getElementById("themeToggle");
const themeIcon=document.getElementById("themeIcon");
const themeLabel=document.getElementById("themeLabel");
const form=document.getElementById("secretForm");
const accessKeyInput=document.getElementById("accessKeyInput");
const messageInput=document.getElementById("messageInput");
const charCounter=document.getElementById("charCounter");
const submitBtn=document.getElementById("submitBtn");
const submitText=document.getElementById("submitText");
const statusBox=document.getElementById("statusBox");
const voiceBtn=document.getElementById("voiceBtn");
const voiceIcon=document.getElementById("voiceIcon");
const voiceText=document.getElementById("voiceText");

function setIcon(el,id){el.innerHTML='<use href="#'+id+'"/>';}

function applyTheme(theme){
  htmlEl.setAttribute("data-theme",theme);
  if(theme==="dark"){setIcon(themeIcon,"i-sun");themeLabel.textContent="نهاري";}
  else{setIcon(themeIcon,"i-moon");themeLabel.textContent="ليلي";}
}
const systemDark=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function getSaved(){
  try{const t=localStorage.getItem("kelma_theme");return t==="dark"||t==="light"?t:null;}catch(_){return null;}
}
applyTheme(getSaved()||(systemDark&&systemDark.matches?"dark":"light"));
themeToggle.addEventListener("click",()=>{
  const next=htmlEl.getAttribute("data-theme")==="dark"?"light":"dark";
  applyTheme(next);
  try{localStorage.setItem("kelma_theme",next);}catch(_){}
});
if(systemDark){
  const onSystemChange=(e)=>{if(!getSaved())applyTheme(e.matches?"dark":"light");};
  if(systemDark.addEventListener)systemDark.addEventListener("change",onSystemChange);
  else if(systemDark.addListener)systemDark.addListener(onSystemChange);
}

function updateCounter(){
  const n=messageInput.value.length;
  charCounter.textContent=n+" / 1000";
  charCounter.classList.toggle("warn",n>=900);
}
function showStatus(type,msg){statusBox.textContent=msg;statusBox.className="status-box show "+type;}
function hideStatus(){statusBox.className="status-box";statusBox.textContent="";}

messageInput.addEventListener("input",()=>{
  updateCounter();
  if(statusBox.classList.contains("show"))hideStatus();
});

const allSnippets=Array.from(document.querySelectorAll(".chip")).map((c)=>c.getAttribute("data-text")||"");
document.querySelectorAll(".chip").forEach((chip)=>{
  chip.addEventListener("click",()=>{
    const snippet=chip.getAttribute("data-text")||"";
    const current=messageInput.value;
    const active=allSnippets.find((s)=>s&&current.startsWith(s));
    const rest=active!==undefined?current.slice(active.length):current;
    const next=(snippet+rest).slice(0,1000);
    messageInput.value=next;
    messageInput.focus();
    const pos=active!==undefined?Math.min(snippet.length,next.length):next.length;
    messageInput.setSelectionRange(pos,pos);
    updateCounter();
  });
});

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
  let recognition=null;
  let isListening=false;
  const voiceErrors={
    "not-allowed":"يرجى السماح بالوصول للميكروفون من إعدادات الموقع في Chrome.",
    "service-not-allowed":"خدمة التعرف على الصوت غير متاحة على الجهاز، تأكد من تفعيل Google app وخدمات الكلام.",
    "audio-capture":"الميكروفون مش متاح، ممكن يكون مستخدم في تطبيق تاني.",
    "network":"التعرف على الصوت محتاج إنترنت شغال، تحقق من الاتصال.",
    "no-speech":"ما سمعتش صوت، تكلم بعد ما تظهر كلمة «جاري الاستماع» وحاول مرة تانية.",
    "language-not-supported":"اللغة العربية المصرية مش مدعومة على الجهاز."
  };
  function resetVoiceUI(){
    isListening=false;
    voiceBtn.classList.remove("recording");
    setIcon(voiceIcon,"i-mic");
    voiceText.textContent="اكتب بصوتك";
  }
  function startVoice(){
    recognition=new SpeechRecognition();
    recognition.lang="ar-EG";
    recognition.continuous=false;
    recognition.interimResults=false;
    recognition.maxAlternatives=1;
    recognition.onstart=()=>{
      isListening=true;
      voiceBtn.classList.add("recording");
      setIcon(voiceIcon,"i-stop");
      voiceText.textContent="جاري الاستماع...";
    };
    recognition.onresult=(event)=>{
      const transcript=(event.results[0][0].transcript||"").trim();
      if(!transcript)return;
      const space=messageInput.value&&!messageInput.value.endsWith(" ")?" ":"";
      messageInput.value=(messageInput.value+space+transcript).slice(0,1000);
      updateCounter();
    };
    recognition.onerror=(event)=>{
      if(event.error==="aborted")return;
      showStatus("error",voiceErrors[event.error]||("تعذر التعرف على الصوت ("+event.error+")، حاول مرة أخرى."));
    };
    recognition.onend=resetVoiceUI;
    try{
      recognition.start();
    }catch(err){
      resetVoiceUI();
      showStatus("error","تعذر تشغيل الميكروفون ("+((err&&err.name)||"خطأ")+")، حاول مرة أخرى.");
    }
  }
  voiceBtn.addEventListener("click",()=>{
    if(isListening&&recognition){recognition.stop();return;}
    hideStatus();
    startVoice();
  });
}else{
  voiceBtn.disabled=true;
  voiceText.textContent="الصوت غير مدعوم";
}

</script>
<script>
(function(){
const C=window.KELMA||{};
const sb=(C.url&&C.key&&window.supabase)?window.supabase.createClient(C.url,C.key):null;
const $=(id)=>document.getElementById(id);
const code=new URLSearchParams(location.search).get("l");
const base=location.origin+location.pathname;
let dashUser=null;
function show(id){document.querySelectorAll(".view").forEach((e)=>{e.hidden=e.id!==id;});}
function st(el,type,msg){el.textContent=msg;el.className="status-box show "+type;}
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function ico(id){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("class","ic");s.innerHTML='<use href="#'+id+'"/>';return s;}
function btn(label,icon,fn){const b=h("button","chip");b.type="button";if(icon)b.appendChild(ico(icon));b.appendChild(document.createTextNode(label));b.addEventListener("click",fn);return b;}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("اتنسخ اللينك");}catch(_){prompt("انسخ اللينك:",t);}}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();hideStatus();
  const text=messageInput.value.trim();
  if(!text){showStatus("error","اكتب رسالتك الأول قبل الإرسال.");return;}
  if(form.botcheck&&form.botcheck.checked){showStatus("success","تم إرسال رسالتك بنجاح، شكرًا لصراحتك.");messageInput.value="";updateCounter();return;}
  if(!sb){showStatus("error","الموقع لسه متربطش بقاعدة البيانات.");return;}
  submitBtn.disabled=true;submitText.textContent="بتتبعت...";
  try{
    const {error}=await sb.rpc("send_message",{p_code:code,p_body:text});
    if(!error){showStatus("success","تم إرسال رسالتك بنجاح، شكرًا لصراحتك.");messageInput.value="";updateCounter();}
    else if(/not_found/.test(error.message)){showStatus("error","اللينك ده مش شغال حاليًا.");}
    else if(/rate_limited/.test(error.message)){showStatus("error","اتبعتت رسائل كتير للينك ده، جرّب بعد شوية.");}
    else{showStatus("error","تعذر إرسال الرسالة، حاول مرة أخرى.");}
  }catch(_){showStatus("error","حدث خطأ في الاتصال، تحقق من الإنترنت وحاول مجددًا.");}
  finally{submitBtn.disabled=false;submitText.textContent="ابعت كلمتك";}
});

const S={links:[],msgs:[],f:"all"};
const PAL=["#2f6bc2","#d4a63a","#c4513d","#2f8f6b","#8a4fb0"];
const col=(id)=>PAL[Math.max(0,S.links.findIndex((l)=>l.id===id))%PAL.length];
const rtf=new Intl.RelativeTimeFormat("ar",{numeric:"auto"});
function ago(d){const x=(new Date(d)-Date.now())/1000,a=Math.abs(x);if(a<60)return "الآن";if(a<3600)return rtf.format(Math.round(x/60),"minute");if(a<86400)return rtf.format(Math.round(x/3600),"hour");return rtf.format(Math.round(x/86400),"day");}
function tab(p){["pm","pl","pa"].forEach((x)=>{$(x).hidden=x!==p;});document.querySelectorAll("#bn button").forEach((b)=>b.classList.toggle("on",b.dataset.p===p));$("fabw").hidden=p!=="pl";}
async function load(){
  let {data:ls,error}=await sb.from("links").select("*").order("created_at");
  if(error){toast("تعذر تحميل البيانات.");return;}
  if(!ls.length){await sb.from("links").insert({name:"لينكي"});({data:ls}=await sb.from("links").select("*").order("created_at"));}
  const {data:ms}=await sb.from("messages").select("id,link_id,body,read,created_at").order("created_at",{ascending:false}).limit(300);
  S.links=ls||[];S.msgs=ms||[];
  if(S.f!=="all"&&!S.links.some((l)=>l.id===S.f))S.f="all";
  draw();
}
function draw(){
  const un=S.msgs.filter((m)=>!m.read);
  $("cnt").textContent=un.length;
  $("heroTxt").textContent=un.length?"من "+new Set(un.map((m)=>m.link_id)).size+" روابط · آخرها "+ago(un[0].created_at):"مفيش رسائل جديدة";
  $("readAll").hidden=!un.length;$("bnN").hidden=!un.length;$("bnN").textContent=un.length;
  drawRail();drawMsgs();drawLinks();
}
function drawRail(){
  const r=$("rail");r.replaceChildren();
  const mk=(id,label,c)=>{const b=btn(label,null,()=>{S.f=id;drawRail();drawMsgs();});if(c){const i=h("i");i.style.setProperty("--c",c);b.prepend(i);}if(S.f===id)b.classList.add("on");r.appendChild(b);};
  mk("all","الكل");S.links.forEach((l)=>mk(l.id,l.name,col(l.id)));
}
function drawMsgs(){
  const box=$("msgBox");box.replaceChildren();
  const list=S.msgs.filter((m)=>S.f==="all"||m.link_id===S.f);
  if(!list.length){box.appendChild(h("div","empty","لسه مفيش رسائل. شارك لينكك وهتوصلك هنا."));return;}
  const names={};S.links.forEach((l)=>{names[l.id]=l.name;});
  list.forEach((m)=>{
    const d=h("div","bb"+(m.read?"":" new"));d.appendChild(h("p",null,m.body));
    const mt=h("div","meta"),tg=h("span","tag"),dot=h("i");
    dot.style.setProperty("--c",col(m.link_id));tg.appendChild(dot);tg.appendChild(document.createTextNode(names[m.link_id]||""));
    const r=h("span",null,ago(m.created_at)+" "),del=h("button","ib");
    del.type="button";del.setAttribute("aria-label","مسح");del.appendChild(ico("i-trash"));
    del.addEventListener("click",async()=>{if(!confirm("تمسح الرسالة دي؟"))return;await sb.from("messages").delete().eq("id",m.id);S.msgs=S.msgs.filter((x)=>x.id!==m.id);draw();});
    r.title=new Date(m.created_at).toLocaleString("ar-EG");r.appendChild(del);mt.appendChild(tg);mt.appendChild(r);d.appendChild(mt);
    d.addEventListener("click",async(e)=>{if(e.target.closest("button"))return;await sb.from("messages").update({read:!m.read}).eq("id",m.id);m.read=!m.read;draw();});
    box.appendChild(d);
  });
}
function drawLinks(){
  const box=$("linksBox");box.replaceChildren();
  S.links.forEach((l)=>{
    const url=base+"?l="+l.code,n=S.msgs.filter((m)=>m.link_id===l.id&&!m.read).length;
    const card=h("div","lk"),head=h("div","lh"),nm=h("span",null,l.name);
    card.style.setProperty("--c",col(l.id));
    if(!l.active)nm.appendChild(h("span","off"," · متوقف"));
    head.appendChild(nm);
    const r=h("span","row");
    if(n)r.appendChild(h("span","cnt2",String(n)));
    const sw=h("label","sw"),ck=document.createElement("input");
    ck.type="checkbox";ck.checked=l.active;ck.setAttribute("aria-label","تفعيل اللينك");
    ck.addEventListener("change",async()=>{await sb.from("links").update({active:ck.checked}).eq("id",l.id);toast(ck.checked?"اللينك اتفعّل":"اللينك اتوقف");load();});
    sw.appendChild(ck);sw.appendChild(document.createElement("i"));r.appendChild(sw);head.appendChild(r);
    card.appendChild(head);card.appendChild(h("div","url",url));
    const a=h("div","row");
    a.appendChild(btn("الرسائل",null,()=>{S.f=l.id;drawRail();drawMsgs();tab("pm");}));
    a.appendChild(btn("نسخ","i-copy",()=>copy(url)));
    a.appendChild(btn("مشاركة","i-share",()=>{if(navigator.share){navigator.share({title:"كلمة في سرك",text:"ابعتلي كلمة بصراحة، هويتك مش هتظهر.",url}).catch(()=>{});}else{copy(url);}}));
    a.appendChild(btn("الاسم","i-edit",async()=>{const v=prompt("اسم اللينك:",l.name);if(v&&v.trim()&&v.trim()!==l.name){await sb.from("links").update({name:v.trim().slice(0,40)}).eq("id",l.id);load();}}));
    a.appendChild(btn("مسح","i-trash",async()=>{if(!confirm("تمسح اللينك ده وكل رسايله؟"))return;await sb.from("links").delete().eq("id",l.id);toast("اتمسح");load();}));
    card.appendChild(a);box.appendChild(card);
  });
}
document.querySelectorAll("#bn button").forEach((b)=>b.addEventListener("click",()=>tab(b.dataset.p)));
$("readAll").addEventListener("click",async()=>{let q=sb.from("messages").update({read:true}).eq("read",false);if(S.f!=="all")q=q.eq("link_id",S.f);await q;toast("تمام");load();});
$("refBtn").addEventListener("click",()=>{load();toast("اتحدّثت");});
$("themeBtn2").addEventListener("click",()=>themeToggle.click());
{const scr=document.getElementById("vDash");let tm;
scr.addEventListener("scroll",()=>{$("fabw").classList.add("gone");clearTimeout(tm);tm=setTimeout(()=>$("fabw").classList.remove("gone"),450);},{passive:true,capture:true});}
const VAPID=C.vapid||"";
function u8(x){const p="=".repeat((4-x.length%4)%4),r=atob((x+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r,(c)=>c.charCodeAt(0));}
async function pushState(){
  const b=$("pushBtn");
  if(!("serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window)){b.textContent="الإشعارات مش مدعومة هنا";b.disabled=true;return;}
  const reg=await navigator.serviceWorker.getRegistration();
  const sub=reg?await reg.pushManager.getSubscription():null;
  const on=!!sub&&Notification.permission==="granted";
  b.dataset.on=on?"1":"";b.textContent=on?"إيقاف الإشعارات":"فعّل الإشعارات";
}
$("pushBtn").addEventListener("click",async()=>{
  const b=$("pushBtn");
  try{
    const reg=await navigator.serviceWorker.ready;
    if(b.dataset.on){
      const sub=await reg.pushManager.getSubscription();
      if(sub){await sb.from("push_subscriptions").delete().eq("endpoint",sub.endpoint);await sub.unsubscribe();}
      toast("اتوقفت الإشعارات");
    }else{
      if(!VAPID){toast("الإشعارات لسه متضبطتش.");return;}
      if(await Notification.requestPermission()!=="granted"){toast("لازم توافق على إذن الإشعارات.");return;}
      const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
      const j=sub.toJSON();
      const {error}=await sb.from("push_subscriptions").upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"});
      if(error){toast("تعذر حفظ الاشتراك.");return;}
      toast("الإشعارات شغالة");
    }
  }catch(_){toast("تعذر ضبط الإشعارات.");}
  pushState();
});
$("fab").addEventListener("click",async()=>{
  const n=(prompt("اسم اللينك الجديد (مثلاً: الشغل):")||"").trim();if(!n)return;
  const {error}=await sb.from("links").insert({name:n.slice(0,40)});
  if(error){toast("تعذر إنشاء اللينك.");return;}
  toast("اتعمل لينك جديد");tab("pl");load();
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&dashUser)load();});
setInterval(()=>{if(!document.hidden&&dashUser)load();},45000);
$("gBtn").addEventListener("click",()=>{sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:base}});});
$("outBtn").addEventListener("click",async()=>{await sb.auth.signOut();});

async function route(session){
  if(code){
    show("vSend");
    const {data}=await sb.rpc("link_status",{p_code:code});
    if(data!==true){submitBtn.disabled=true;messageInput.disabled=true;showStatus("error","اللينك ده مش موجود أو متوقف.");}
    return;
  }
  if(!session){dashUser=null;show("vHome");return;}
  if(dashUser===session.user.id)return;
  dashUser=session.user.id;show("vDash");
  const md=session.user.user_metadata||{};
  const nm=md.full_name||"حسابي";$("who").textContent="أهلاً، "+nm.split(" ")[0];$("accName").textContent=nm;$("accMail").textContent=session.user.email||"";
  load();pushState();
}
if(!sb){
  if(code){show("vSend");}
  else{show("vHome");$("gBtn").disabled=true;st($("homeStatus"),"error","الموقع لسه متربطش بقاعدة البيانات.");}
}else{
  sb.auth.getSession().then(({data})=>route(data.session));
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_IN"||ev==="SIGNED_OUT")route(s);});
}

let dp=null;
window.addEventListener("beforeinstallprompt",(e)=>{e.preventDefault();dp=e;$("installBtn").hidden=false;});
$("installBtn").addEventListener("click",async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$("installBtn").hidden=true;});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
